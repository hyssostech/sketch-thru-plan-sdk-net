# Configuration for SonarQube Cloud AUTOMATIC ANALYSIS.
#
# Read from the DEFAULT BRANCH only, so a change here takes effect from the
# merge onward rather than on the pull request that makes it. Values set here
# silently OVERRIDE the equivalent settings in the web UI, and automatic
# analysis publishes no logs - so the only way to confirm a setting took effect
# is to read the measured value afterwards, not to inspect a run.

# ---------------------------------------------------------------- duplication
# The samples are deliberately near-identical: each is a self-contained WinForms
# application demonstrating one feature, built so a developer can copy exactly
# one and have something that compiles. Sharing a skeleton is the design.
#
# The analyser cannot know that, so a change applied across several samples
# reads as duplicated new code. The default Sonar way gate requires <= 3% on new
# code; the change that removed all 24 blocker findings from this repository
# measured 58.9%. A gate that is red for doing the right thing is one people
# learn to route around, which is worse than having no gate.
#
# third-party/ is here for a different reason: JMSML is vendored upstream code.
# Duplication within it is not ours to remove, and reporting it says nothing
# actionable about this repository.
#
# This removes these paths from DUPLICATION DETECTION ONLY. Issues, bugs,
# vulnerabilities and security hotspots are still reported on them in full. It
# is NOT sonar.exclusions, which would drop the files from analysis altogether
# and lose those findings - a different decision, deliberately not taken here.
#
# Patterns end in /* deliberately: a bare `samples/**` is a documented cause of
# cpd exclusions being silently ignored.
# .github/ is CI tooling and its control fixtures. Measured on PR #74: a test
# file asserting seven ways a check must fail came out at 42% duplicated,
# because each control states its input verbatim. That is the intended form -
# a control that shares a builder with its siblings cannot be read in
# isolation, which is exactly what makes a control worth having.
#
# The principle, so this does not become a habit of excluding whatever is
# inconvenient: exclude from duplication detection where repetition is the
# INTENDED FORM and the copies do not drift together - parallel samples,
# frozen test fixtures, vendored code. Do NOT exclude where duplication
# signals real drift risk in code that evolves. Product code is never
# excluded here, and duplication in src/ remains reportable.
sonar.cpd.exclusions=samples/**/*,third-party/**/*,.github/**/*

# --------------------------------------------------------------------- tests
# Without this the suite is graded as production code - 657 of this repo's
# findings sit in tests/, where assertion-heavy code reads as smells against the
# product's maintainability rating, and the test lines inflate ncloc, which
# deflates coverage.
sonar.tests=tests
