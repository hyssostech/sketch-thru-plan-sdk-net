# Dependabot - automated dependency update PRs
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# STP-705: this repository previously received no dependency updates at all -
# no dependabot.yml and security updates disabled - while its dependency graph
# already resolved 53 packages.
#
# ASCII only. See STP-722.
version: 2
updates:

  # NuGet. Directories are ENUMERATED rather than globbed.
  #
  # The docs confirm that `directories` supports globbing while `directory`
  # does not, but they do not state whether a NuGet entry at "/" discovers
  # nested .csproj files recursively. Nothing in this repository has ever run
  # on a runner, so that behaviour could not be measured before writing this,
  # and a config that silently covered only the root would be a dependency
  # gate that updates nothing while appearing configured - the exact defect
  # class STP-700 exists to close. An explicit list is verifiable by reading.
  #
  # Generated from the tracked manifests at 3021286: every directory holding a
  # .csproj or packages.config. 16 entries; re-derive with
  #   git ls-tree -r --name-only HEAD | grep -E '\.csproj$|packages\.config$' \
  #     | xargs -n1 dirname | sort -u
  # If a project is added or moved and this list is not updated, that project
  # goes unwatched silently.
  - package-ecosystem: nuget
    directories:
      - "/plugins/Mapping/SimpleMapPlugin"
      - "/plugins/Speech/AzureSpeechPlugin"
      - "/quickstart"
      - "/samples/C2SIMSample"
      - "/samples/DotNetFrameworkSample"
      - "/samples/EditingSample"
      - "/samples/ReactiveSample"
      - "/samples/RolesSample"
      - "/samples/ScenarioSample"
      - "/samples/SessionSample"
      - "/samples/SpeechSample"
      - "/samples/TaskOrgSample"
      - "/samples/TaskingSample"
      - "/src/StpSDK.JsonRpc"
      - "/tests/StpSDK.Tests"
      - "/third-party/JMSML"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # System.Drawing.Common MUST stay at v5. It is the last MULTIPLATFORM
      # release: 6.0 required a runtime switch off Windows and 7.0 REMOVED
      # that switch, making the package Windows-only. The SDK builds and tests
      # on ubuntu AND windows, so a bump would not fail at build time - it
      # would throw PlatformNotSupportedException at RUN time on Linux, which
      # is the worst place to find it.
      #
      # A DELIBERATE, DOCUMENTED pin, not staleness. third-party/JMSML/STP.md:
      # "the packages can be updated, with the exception of
      # System.Drawing.Common, which should be kept at version 5. That is the
      # last version that is multiplatform compatible."
      #
      # It is also not ours alone to move: the Svg 3.4.7 package this SDK
      # depends on itself declares System.Drawing.Common 5.0.3, so bumping one
      # means replacing the other. The cross-platform route is Svg.Skia +
      # SkiaSharp, which is a public-API change (JmsSymbol.Bitmap and
      # StpSymbol.Bitmap both return System.Drawing.Bitmap) and belongs with
      # the .NET 10 migration, STP-716.
      #
      # NOT solved upstream: the 5.11 engine trunk still pins 5.* in JMSML and
      # Utility and references no SkiaSharp or ImageSharp; its single 8.0.0 use
      # is a test project, where Windows-only costs nothing.
      #
      # Dependabot proposed 5.* -> 10.0.0 anyway in #37. Without this entry it
      # keeps proposing it, and the reason to refuse lives in files nobody
      # reads while reviewing a dependency PR.
      - dependency-name: "System.Drawing.Common"
    groups:
      # The .NET runtime family moves TOGETHER, majors included.
      #
      # STP-728. Leaving majors ungrouped is correct in general and WRONG for
      # this family. Measured 2026-09-12: four PRs (#21, #23, #26, #27) all
      # failed build-test on both runners with
      #
      #   NU1605 Detected package downgrade: Microsoft.Extensions.Logging
      #          from 10.0.12 to 7.0.0
      #   HyssosTech.Sdk.STP -> JMSML -> Microsoft.Extensions.Logging (>= 10.0.12)
      #   HyssosTech.Sdk.STP -> Microsoft.Extensions.Logging (>= 7.0.0)
      #
      # Dependabot bumped the copy inside third-party/JMSML while StpSDK still
      # referenced 7.0.0 directly, so the transitive demanded a version the
      # direct reference forbade. Neither PR can merge alone; each is blocked
      # BY the other's absence.
      #
      # The engine repo hit exactly this and recorded it as C16 in
      # docs/plan-ato-hardening.md: 'Grouping proved load-bearing, not
      # cosmetic: ungrouped, those 13 cannot be merged individually without
      # NU1605 downgrades.'
      dotnet-runtime-family:
        patterns:
          - "Microsoft.Extensions.*"
          - "System.*"
        update-types:
          - major
          - minor
          - patch
      # Everything else: minor and patch together, majors individually, which
      # is still the right default for unrelated packages.
      nuget-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions. Every ref in this repo is now pinned to a commit SHA
  # (STP-707), which is what makes this entry load-bearing rather than
  # cosmetic: a SHA pin does not float, so without an update mechanism the
  # actions freeze at whatever was current on the day they were pinned and
  # quietly rot. Dependabot understands SHA pins and bumps the SHA and its
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
