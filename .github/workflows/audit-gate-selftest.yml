# Re-prove that the NuGet audit gate CAN FAIL.
#
# STP-703 added the gate and proved it failed four ways before trusting it
# green. That proof lived in a commit message - which is to say it was not
# recorded. Nothing re-ran it, so the gate could narrow or stop running while
# every check stayed green. An independent review then found exactly that: the
# coverage assertion passed at ZERO coverage when restore was cached.
#
# Prose is not a mechanism. This job is the mechanism.
#
# It asserts FAILURE on four distinct inputs and a loud PASS on a clean one. If
# the gate is ever weakened, this goes red - which is the only thing that makes
# a green restore elsewhere in CI mean anything.
#
# Not run on tags: this verifies the gate MECHANISM, not the shipped artifact.
# The gate itself runs against the shipped ref via publish.yml's restore.
#
# ASCII only. See STP-722.

name: Audit gate self-test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Prove the audit gate can fail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The script deliberately does NOT use set -e: most of what it runs is
      # expected to fail, and the failures are the evidence. It returns
      # non-zero only when a case that should have failed did not.
      - name: Assert the gate fails on known-bad input
        run: bash .github/scripts/assert-audit-gate-can-fail.sh StpSDK.sln

  # STP-709. Same principle as the job above, applied to the other gate a
  # release depends on.
  #
  # scripts/release-manifest.sh is what makes SHA256SUMS a claim about the
  # PUBLISHED set rather than about whatever happened to be on disk when it was
  # written. It arrived here from sdk-js, where it had no tests either, so the
  # central integrity control of both repos was being taken on trust.
  #
  # The load-bearing case is a file present in the staging directory but absent
  # from the manifest. `sha256sum -c` walks the manifest and so cannot see it -
  # and that state occurs on EVERY release, the moment the attestation bundle
  # is copied in after the manifest is generated. One of the controls asserts
  # that `sha256sum -c` still fails to catch it, so the reason this script
  # exists cannot quietly evaporate.
  #
  # No .NET, no network: it builds throwaway directories in $TMPDIR.
  release-manifest-selftest:
    name: Prove the release manifest gate can fail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the manifest gate rejects every kind of drift
        run: bash .github/scripts/tests/test-release-manifest.sh
