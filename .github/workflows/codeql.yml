# CodeQL static analysis (SAST) for the STP .NET SDK.
#
# STP-706: neither SDK repo ran SAST of any kind. security.yml covers secrets
# and dependency CVEs; this workflow is the first thing here that reads the
# source for coding-defect classes (injection, unsafe deserialization, path
# traversal, and so on).
#
# Free here because the repository is PUBLIC. The GitHub API distinguishes the
# two cases plainly: these repos answer "404 no analysis found" where the
# private engine repo answers "403 Code Security must be enabled". The control
# that cost the engine a hand-built ephemeral SonarQube is this file.
#
# ASCII only. See STP-722.

name: CodeQL

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Weekly as well as on push. A workflow that only runs on push stops being
    # evidence the moment the repo goes quiet: no commits does not mean no
    # newly-published query packs or newly-disclosed defect patterns. Monday
    # 05:37 UTC - no other workflow in this repo declares a schedule trigger
    # (build-test.yml, docs.yml and publish.yml have none), and the
    # off-the-hour minute avoids the top-of-hour scheduling crush GitHub
    # documents for schedule events.
    - cron: '37 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # upload SARIF to code scanning
      actions: read            # read workflow run status
      contents: read           # check out the repository

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: csharp

          # BUILD MODE: manual, not none.
          #
          # build-mode: none is supported for C#, but GitHub documents it as
          # producing less accurate results when "the build scripts cannot be
          # queried for dependency information" or "the repository normally
          # generates code during the build process". Both caveats apply here:
          # the SDK uses Fody with PropertyChanged.Fody, which rewrites IL at
          # build time, and Teronis.MSBuild.Packaging.ProjectBuildInPackage to
          # fold the JMSML project into the package. A buildless extraction
          # would be guessing at exactly the parts that are least ordinary.
          #
          # The manual build below is the same command build-test.yml already
          # runs and is known green (verified locally: exit 0, 357 tests pass),
          # so this costs accuracy nothing and buys correctness.
          build-mode: manual

          # ---------------------------------------------------------------
          # ACTUAL SCOPE (STP-706): whatever the Build step below compiles,
          # and nothing else. That is StpSDK.sln - 3 projects
          # (src/StpSDK.JsonRpc, third-party/JMSML, tests/StpSDK.Tests) out
          # of the repository's 16 .csproj files.
          #
          # NOT COVERED, and only a build step can change it: both plugins,
          # quickstart, and all 10 sample projects. Widening coverage means
          # compiling more, not configuring more.
          #
          # There is deliberately no `config:` / `paths-ignore:` here. An
          # earlier revision carried one, and a cold-start review established
          # it was inert: GitHub documents paths/paths-ignore as usable "when
          # you run the CodeQL actions on an interpreted language ... or when
          # you analyze a compiled language WITHOUT building the code". This
          # job is build-mode: manual, so the filter never applied. It was
          # doubly inert - it named docs/_site/**, which is in .gitignore and
          # has 0 tracked files, so it excluded a path that is not in the
          # checkout. Inert configuration that reads like a control is worse
          # than none: it invites the next reader to believe the scope is
          # managed here when it is set by the build.
          #
          # third-party/JMSML is in scope because the solution builds it, and
          # that is the right outcome: it SHIPS - referenced PrivateAssets="all"
          # and folded into the HyssosTech.Sdk.STP nupkg, so its defects reach
          # consumers as surely as src/ does. At 46 files / ~17k lines of
          # hand-written Apache-2.0 Esri C# it is also not the alert-volume
          # problem that justified excluding sdk-js's 120k-line generated
          # bundle. Note this is a consequence of the build, not a choice
          # expressed in this file - excluding it would require removing it
          # from the solution.
          # ---------------------------------------------------------------

      - name: Build (Release)
        run: dotnet build StpSDK.sln -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:csharp'
