name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # STP-728. STP-707 SHA-pinned every action here; nothing enforced it, so
      # a `uses: foo@v1` would merge green. node is preinstalled on the GitHub
      # ubuntu runner, so this needs no setup-node step.
      - name: Assert actions are SHA-pinned
        run: node .github/scripts/assert-action-pins.mjs .github/workflows

      - name: Test the action pin check
        run: node .github/scripts/tests/test-assert-action-pins.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore StpSDK.sln

      - name: Build (Release)
        run: dotnet build StpSDK.sln -c Release --no-restore

      # Exclude the live-engine integration smoke tests (they need an STP server on :9599).
      - name: Test
        run: dotnet test StpSDK.sln -c Release --no-build --filter "Category!=SmokeTest" --verbosity normal
