name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # STP-728. STP-707 SHA-pinned every action here; nothing enforced it, so
      # a `uses: foo@v1` would merge green. node is preinstalled on the GitHub
      # ubuntu runner, so this needs no setup-node step.
      - name: Assert actions are SHA-pinned
        run: node .github/scripts/assert-action-pins.mjs .github/workflows

      - name: Test the action pin check
        run: node .github/scripts/tests/test-assert-action-pins.mjs

      # STP-743 method, adopted from the engine effort. `#pragma warning disable
      # S<digits>` is honoured by the Sonar analyser and is the right mechanism
      # for a per-site false positive - the reason sits where the next reader
      # will meet it, and it moves with the code, where a path-scoped config
      # entry silently stops matching the day a file is renamed.
      #
      # The hazard is the same property: a pragma is one line and needs no
      # review, so it can dispose of a real finding with no argument and no
      # record. The engine repository accumulated 102 pragmas that way, most
      # carrying no reason at all. This repository has two, and installing the
      # rule while the count is two is the entire point.
      #
      # The dated REVIEW this enforces closes a gap the engine effort named and
      # did not close: neither pragmas nor config suppressions expire.
      # hardened-ci.yml's claim that nothing can be suppressed indefinitely
      # without someone re-arguing it was true of the dependency gates and false
      # of this one. Now it is true of both.
      - name: Assert Sonar suppressions are justified, dated and scoped
        run: node .github/scripts/assert-sonar-pragmas-governed.mjs .

      - name: Test the Sonar suppression check
        run: node .github/scripts/tests/test-assert-sonar-pragmas-governed.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore StpSDK.sln

      - name: Build (Release)
        run: dotnet build StpSDK.sln -c Release --no-restore

      # Exclude the live-engine integration smoke tests (they need an STP server on :9599).
      #
      # STP-740. coverlet.collector has been a PackageReference of the test
      # project since long before this line, but nothing ever asked for
      # coverage - so every CI run restored the package, resolved it, carried it
      # in the dependency graph, and measured exactly nothing. The settings and
      # collector below are the other half of that reference.
      - name: Test
        run: >
          dotnet test StpSDK.sln -c Release --no-build
          --filter "Category!=SmokeTest" --verbosity normal
          --settings .runsettings
          --collect:"XPlat Code Coverage"
          --results-directory coverage-out

      # dotnet test exits 0 whether or not the collector produced anything: a
      # misspelled collector name, ignored runsettings, or an over-broad Exclude
      # all leave a green step and no report. The step above therefore cannot
      # tell anyone that coverage happened. This one can.
      - name: Assert coverage was actually collected
        run: node .github/scripts/assert-coverage-collected.mjs coverage-out

      # ...and prove that assertion can fail, so it is evidence rather than
      # decoration. Same reasoning as the action-pin check above.
      - name: Prove the coverage gate can fail
        run: node .github/scripts/tests/test-assert-coverage-collected.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-out
          if-no-files-found: error

      # STP-775. The .NET Framework sample is the ONLY consumer of the SDK's
      # netstandard2.0 target, and until now nothing built it: it is not in
      # StpSDK.sln, the steps above build only the solution, and its legacy
      # csproj could not be built by `dotnet` at all. So the netstandard2.0 leg
      # shipped untested, and a break there would have surfaced at a .NET
      # Framework customer rather than here.
      #
      # It stays OUT of the solution on purpose - net48 cannot build on the
      # ubuntu runner - hence a separate Windows-only step rather than adding it
      # to StpSDK.sln and breaking the other matrix leg.
      - name: Build the .NET Framework sample (netstandard2.0 consumer)
        if: runner.os == 'Windows'
        run: dotnet build samples/DotNetFrameworkSample/DotNetFrameworkSample.csproj -c Release

      # A build that quietly resolved the modern target would prove nothing
      # about netstandard2.0, so assert which assembly actually landed next to
      # the exe. Byte comparison rather than reading project.assets.json: a
      # ProjectReference is recorded there under the referenced project's
      # PackageId, not under a lib path, so the obvious grep matches nothing.
      #
      # The TFM is DERIVED from the csproj, not written here. STP-716 moved the
      # SDK from net8.0 to net10.0 and this step still named net8.0, so the
      # "are the two targets even distinguishable" control below silently
      # stopped running - its `[ -f ... ]` guard was simply false - and the step
      # went on passing. A path that encodes a TFM is a path that expires, and
      # one guarded by `-f` expires without saying anything.
      - name: Assert the sample really consumed netstandard2.0
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          project=src/StpSDK.JsonRpc/StpSDK.csproj
          copied=samples/DotNetFrameworkSample/bin/Release/net48/StpSDK.dll
          ns20=src/StpSDK.JsonRpc/bin/Release/netstandard2.0/StpSDK.dll

          # `|| true` on both: grep exits 1 when nothing matches, and
          # under `set -euo pipefail` that would kill the step before the
          # explicit check below could say why. Fail closed, but say so.
          tfms="$(sed -n 's;.*<TargetFrameworks>\(.*\)</TargetFrameworks>.*;\1;p' "$project" | head -n 1 || true)"
          modern="$(echo "$tfms" | tr ';' '\n' | grep -v '^netstandard' | head -n 1 || true)"
          if [ -z "$modern" ]; then
            echo "::error::no non-netstandard TFM in $project (TargetFrameworks='$tfms')"
            exit 1
          fi
          other="src/StpSDK.JsonRpc/bin/Release/$modern/StpSDK.dll"
          echo "discriminating against the $modern build: $other"

          # $other is ASSERTED present, not probed with -f. When this step named
          # a TFM that no longer existed, an -f guard turned the discriminator
          # into a no-op and left the step green.
          for f in "$copied" "$ns20" "$other"; do
            test -f "$f" || { echo "::error::missing $f - did the build run?"; exit 1; }
          done

          if ! cmp -s "$copied" "$ns20"; then
            echo "::error::the sample did not ship the netstandard2.0 StpSDK build."
            sha256sum "$copied" "$ns20" || true
            exit 1
          fi

          # If the two SDK targets were byte-identical the check above could pass
          # for the wrong reason, so prove they are actually distinguishable.
          if cmp -s "$ns20" "$other"; then
            echo "::error::the netstandard2.0 and $modern builds are identical - this assertion cannot discriminate."
            exit 1
          fi

          echo "PASS: sample shipped the netstandard2.0 StpSDK build."
