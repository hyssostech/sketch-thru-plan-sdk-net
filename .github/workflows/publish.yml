name: Pack and Publish to NuGet.org

on:
  push:
    tags:
      - 'v*'          # triggers on version tags like v0.4.0-preview, v1.0.0, etc.
  workflow_dispatch:

permissions:
  id-token: write      # required for NuGet Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The FILE sets the published version, not the tag: `dotnet pack` reads
      # <Version> from the csproj and ignores GITHUB_REF entirely. release.yml
      # asserts the two agree - but it fires on the same tag as this workflow,
      # in parallel, with no `needs:`, so its guard does nothing for the job
      # that actually pushes to nuget.org.
      #
      # This nearly went wrong on v0.6.0-rc.1: the csproj still said 0.5.0, so
      # this workflow would have published STABLE 0.5.0 under a candidate tag.
      # --skip-duplicate would have swallowed it only because 0.5.0 already
      # existed; for a version that did not, NuGet has no delete, only unlist.
      - name: Assert the tag agrees with the version being packed
        run: |
          set -euo pipefail
          project=src/StpSDK.JsonRpc/StpSDK.csproj
          version="$(sed -n 's;.*<Version>\(.*\)</Version>.*;\1;p' "$project" | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::no <Version> in $project"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} implies $tag_version but $project says $version. The FILE sets the published version; fix one of them before publishing."
              exit 1
            fi
            echo "tag ${GITHUB_REF_NAME} agrees with <Version> $version"
          else
            echo "dispatch run: would publish $version from the manifest"
          fi

      - name: Restore
        run: dotnet restore StpSDK.sln

      # Build the whole solution so the test project (and its dependencies) are
      # available for the --no-build test run below.
      - name: Build (Release)
        run: dotnet build StpSDK.sln -c Release --no-restore

      - name: Test
        run: dotnet test StpSDK.sln -c Release --no-build --filter "Category!=SmokeTest" --verbosity normal

      # No --no-build: the Teronis ProjectBuildInPackage step must build the bundled
      # JMSML project, which conflicts with NoBuild (NETSDK1085).
      - name: Pack NuGet package
        run: dotnet pack src/StpSDK.JsonRpc/StpSDK.csproj -c Release -o ./artifacts

      # NuGet Trusted Publishing (OIDC). Requires:
      #   - a NUGET_USER repo secret (the nuget.org account/username), and
      #   - a Trusted Publishing policy on nuget.org authorizing
      #     hyssostech/sketch-thru-plan-sdk-net + this workflow for HyssosTech.Sdk.STP.
      - name: NuGet login (Trusted Publishing OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols to NuGet.org
        run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
